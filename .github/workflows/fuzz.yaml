name: 🔀 Fuzz Testing

on:
  schedule:
    - cron: '0 3 * * 1'  # Weekly on Monday at 3 AM UTC
  workflow_dispatch:

jobs:
  discover:
    name: "Discover fuzz packages"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - uses: projectdiscovery/actions/setup/go@v1
      - name: "Discover fuzzable packages"
        id: discover
        run: make discover-fuzz-packages

  fuzz:
    name: "Fuzz ${{ matrix.pkg }}"
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: projectdiscovery/actions/setup/go@v1
      - name: "Run fuzzer"
        id: fuzz
        run: make fuzz-ci GOFUZZ_PACKAGE=${{ matrix.pkg }} FUZZ_DURATION=300
      - name: "Upload crashers"
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ steps.fuzz.outputs.artifact_name }}
          path: ${{ matrix.pkg }}/.gofuzz/crashers/
